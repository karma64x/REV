<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12112b">
<title>Pliego · Creador de revistas digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e7f1;--panel:#fbfaff;--ink:#1d1b3a;--mut:#6d6a8a;--line:#d6d3e6;--acc:#5b3df5;--acc2:#ff5c8a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body[data-v=rd]{background:#12112b}
body[data-v=rd] .top{display:none}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font:800 26px 'Bricolage Grotesque',Georgia,sans-serif;letter-spacing:-.03em}
.logo i{display:inline-block;width:10px;height:10px;background:var(--acc2);border-radius:50% 50% 50% 0;margin-left:3px}
#hint{color:var(--mut);flex:1;font-size:14px}
.b{background:#fff;color:var(--ink);border:1px solid var(--line);padding:9px 15px;border-radius:10px;font:500 14px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;transition:border-color .15s,transform .15s;touch-action:manipulation;min-height:40px}
.b:hover{border-color:var(--acc)}.b:active{transform:scale(.97)}
.b:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.b.sq{width:46px;height:46px;padding:0;font-size:20px;border-radius:50%}
#up{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}
.hero{max-width:680px;text-align:center}
.hero h1{font:800 clamp(32px,8vw,64px)/1 'Bricolage Grotesque',Georgia,sans-serif;letter-spacing:-.035em}
.hero p{color:var(--mut);margin:18px auto 26px;max-width:500px;font-size:17px}
.drop{display:block;border:2px dashed #b7b2d6;border-radius:26px 26px 26px 6px;padding:46px 24px;cursor:pointer;background:var(--panel);transition:.2s}
.drop:hover,.drop.ov{border-color:var(--acc);background:#f3f0ff;transform:rotate(-.6deg)}
.drop b{display:block;font:700 20px 'Bricolage Grotesque',sans-serif}.drop span{color:var(--mut);font-size:14px}
.hero .b{margin-top:16px}
#ed{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
#panel{overflow:auto;padding:18px 20px 40px;background:var(--panel);border-right:1px solid var(--line);-webkit-overflow-scrolling:touch}
#panel h2{font:800 22px 'Bricolage Grotesque',sans-serif;margin-bottom:14px;letter-spacing:-.02em}
.g{border-top:1px solid var(--line);padding:4px 0 6px}
.g summary{font:700 15px 'Bricolage Grotesque',sans-serif;padding:10px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.g summary::-webkit-details-marker{display:none}.g summary::after{content:'+';color:var(--mut)}.g[open] summary::after{content:'–'}
.fl{display:block;margin-bottom:12px}.fl span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text],select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:16px;color:var(--ink)}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:3px}
.rg{display:flex;align-items:center;gap:10px}.rg output{min-width:54px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{flex:1;accent-color:var(--acc);height:32px}
.ck{display:flex;gap:10px;align-items:center;margin-bottom:12px;cursor:pointer;min-height:32px}.ck input{accent-color:var(--acc);width:20px;height:20px}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pre button{border:0;color:#fff;padding:12px;border-radius:12px 12px 12px 3px;font:600 13px 'Instrument Sans',sans-serif;cursor:pointer;text-shadow:0 1px 3px #0008}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;perspective:2600px;overflow:hidden;touch-action:none;cursor:pointer;background:#1b1a3e;user-select:none;-webkit-user-select:none}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px;background:var(--panel);border-top:1px solid var(--line)}
.lab{min-width:110px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.th{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#12112b;border-top:1px solid #0006;-webkit-overflow-scrolling:touch}
.th img{height:56px;border-radius:3px;opacity:.45;cursor:pointer;flex:none;border:2px solid transparent;transition:opacity .2s}.th img.on{opacity:1;border-color:var(--acc2)}
#rd{flex:1;display:flex;flex-direction:column;min-height:0;background:#12112b;color:#fff}
.rt{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#0000004d}
.rt h1{flex:1;min-width:0;font:800 18px 'Bricolage Grotesque',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rd .b{background:#ffffff1a;border-color:#ffffff30;color:#fff}#rd .b.p{background:var(--acc2);border-color:var(--acc2)}
#rd .bar{background:#0000004d;border-color:#ffffff14;color:#fff}
.bkw{position:relative;width:calc(var(--pw)*2);height:var(--ph);transform-style:preserve-3d;transition:transform var(--t) cubic-bezier(.5,.05,.2,1)}
.bkw.o0{transform:translateX(calc(var(--pw)*-.5))}.bkw.oE{transform:translateX(calc(var(--pw)*.5))}
.sd{position:absolute;top:0;left:0;width:100%;height:100%;transform:translateZ(-2px);box-shadow:0 30px 70px rgba(0,0,0,calc(var(--sh)*.8));transition:all var(--t) cubic-bezier(.5,.05,.2,1);border-radius:var(--rad)}
.bkw.o0 .sd{left:50%;width:50%}.bkw.oE .sd{width:50%}
.bk{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.leaf{position:absolute;top:0;left:50%;width:var(--pw);height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform var(--t) cubic-bezier(.5,.05,.2,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face,.pg{position:absolute;inset:0;background:#fff;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.f{border-radius:0 var(--rad) var(--rad) 0}.face.b{transform:rotateY(180deg);border-radius:var(--rad) 0 0 var(--rad)}
.face::after,.face::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1}
.face.f::after{background:linear-gradient(90deg,rgba(0,0,0,calc(var(--sh)*.45)),transparent 13%)}
.face.b::after{background:linear-gradient(270deg,rgba(0,0,0,calc(var(--sh)*.45)),transparent 13%)}
.face::before{background:#000;opacity:0}.turn .face::before{animation:shd var(--t) ease-in-out}
@keyframes shd{50%{opacity:calc(var(--sh)*.4)}}
.sg{position:relative;width:var(--pw);height:var(--ph);transform-style:preserve-3d}
.pg{border-radius:var(--rad);box-shadow:0 25px 60px rgba(0,0,0,calc(var(--sh)*.7))}
.face img,.pg img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;filter:sepia(var(--warm))}
#ld{position:fixed;inset:0;z-index:50;background:#1d1b3ae6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.spin{width:44px;height:44px;border:4px solid #ffffff30;border-top-color:var(--acc2);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{rotate:360deg}}
.pb{width:min(320px,70vw);height:6px;background:#ffffff25;border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--acc2);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 30px;background:#1d1b3a;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center}#toast.on{opacity:1;translate:-50% 0}
@media(max-width:820px){
 #ed{grid-template-columns:1fr;grid-template-rows:minmax(0,52%) minmax(0,48%)}
 .work{order:1}#panel{order:2;border:0;border-top:1px solid var(--line);padding:6px 16px 30px}
 #hint,.lg{display:none}.top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:8px}.logo{font-size:22px;flex:1}
 .th img{height:44px}.rt h1{font-size:16px}.lab{min-width:90px}.bar{gap:10px;padding:6px}
 .rt .b{padding:8px 11px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body data-v="up">
<script id="emb">window.__EMBED=null/*E*/</script>
<header class="top"><span class="logo">Pliego<i></i></span><span id="hint">Convierte un PDF en una revista que se hojea</span><div id="tb" style="display:flex;gap:8px"></div></header>

<main id="up">
 <div class="hero">
  <h1>Tu PDF, ahora una revista que se hojea.</h1>
  <p>Sube el archivo, elige cómo se pasan las páginas, ajusta el aspecto y descarga tu revista terminada en un solo archivo.</p>
  <label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf" hidden><b>Toca para elegir tu PDF</b><span>o suéltalo aquí. Se procesa en tu dispositivo, no se sube a ningún servidor.</span></label>
  <button class="b" id="demo">Probar con una revista de ejemplo</button>
 </div>
</main>

<main id="ed" hidden>
 <section class="work">
  <div class="stage" id="stage"></div>
  <div class="bar"><button class="b sq" id="ep" aria-label="Página anterior">‹</button><span class="lab" id="lab"></span><button class="b sq" id="en" aria-label="Página siguiente">›</button></div>
  <div class="th" id="th"></div>
 </section>
 <aside id="panel"></aside>
</main>

<div id="rd" hidden>
 <div class="rt">
  <button class="b" id="bk">Editar</button><h1 id="rt"></h1>
  <button class="b" id="fs">Pantalla completa</button><button class="b p" id="dl">Descargar HTML</button>
 </div>
 <div class="stage" id="rs"></div>
 <div class="bar"><button class="b sq" id="rp" aria-label="Página anterior">‹</button><span class="lab" id="rl"></span><button class="b sq" id="rn" aria-label="Página siguiente">›</button></div>
 <div class="th" id="rth"></div>
</div>

<div id="ld" hidden><div class="spin"></div><p id="lm"></p><div class="pb"><i id="lp"></i></div></div>
<div id="toast" role="status"></div>

<script>
(()=>{
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s),E=window.__EMBED;
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const MOB=innerWidth<700;
const D={title:'Mi revista',style:'book',speed:900,shadow:.6,sound:true,bg1:'#3a2f8f',bg2:'#12112b',radius:2,warm:0,auto:0,thumbs:true,q:MOB?1:1.5};
const TH=[['Medianoche','#3a2f8f','#12112b'],['Coral','#ff7a6b','#7b2d5b'],['Océano','#1d7f9c','#082a3a'],['Papel','#d9d4c7','#8d877a']];
const STY={book:'Libro 3D (doble página)',slide:'Deslizar',fade:'Desvanecer',cube:'Cubo 3D',flip:'Giro de tarjeta',zoom:'Zoom'};
const P=[
['Información',[['title','text','Título de la revista']]],
['Paso de página',[['style','sel','Estilo',STY],['speed','rng','Duración',[250,2000,50,' ms']],['shadow','rng','Intensidad de sombras',[0,1,.05,'']],['sound','chk','Sonido de papel al pasar']]],
['Aspecto',[['bg1','col','Fondo, color central'],['bg2','col','Fondo, color de borde'],['radius','rng','Esquinas de página',[0,24,1,' px']],['warm','rng','Tono de papel cálido',[0,.6,.05,'']]]],
['Lectura',[['auto','rng','Pasar páginas solas (0 = apagado)',[0,15,1,' s']],['thumbs','chk','Mostrar miniaturas']]],
['Calidad',[['q','sel','Resolución de las páginas',{1:'Ligera (archivo pequeño)',1.5:'Media',2:'Alta (archivo pesado)'}]]]
];
let S={...D},pages=[],ratio=.75,pdfDoc=null,act=null,bE=null,bR=null,AC;
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),3500)}
const load=(on,m='',p=0)=>{$('#ld').hidden=!on;$('#lm').textContent=m;$('#lp').style.width=p*100+'%'};
function show(v){document.body.dataset.v=v;['up','ed','rd'].forEach(x=>$('#'+x).hidden=x!==v)}

function snd(){if(!S.sound)return;try{const a=AC||(AC=new (window.AudioContext||window.webkitAudioContext)()),n=a.sampleRate*.2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=2200;g.gain.value=.3;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}

/* ===== motor del libro ===== */
const ANI={
 slide:d=>[[{transform:'none'},{transform:`translateX(${-100*d}%)`}],[{transform:`translateX(${100*d}%)`},{transform:'none'}]],
 fade:()=>[[{opacity:1},{opacity:0}],[{opacity:0},{opacity:1}]],
 zoom:()=>[[{transform:'scale(1)',opacity:1},{transform:'scale(1.35)',opacity:0}],[{transform:'scale(.75)',opacity:0},{transform:'scale(1)',opacity:1}]],
 cube:(d,w)=>[[{transform:`translateZ(${-w/2}px) rotateY(0) translateZ(${w/2}px)`},{transform:`translateZ(${-w/2}px) rotateY(${-90*d}deg) translateZ(${w/2}px)`}],[{transform:`translateZ(${-w/2}px) rotateY(${90*d}deg) translateZ(${w/2}px)`},{transform:`translateZ(${-w/2}px) rotateY(0) translateZ(${w/2}px)`}]],
 flip:d=>[[{transform:'rotateY(0)'},{transform:`rotateY(${-90*d}deg)`}],[{transform:`rotateY(${90*d}deg)`},{transform:'rotateY(0)'}],1]
};
function Book(root,cb,auto){
 let mode,c=0,L=0,maxC=0,cur=0,busy=false,bkw,leaves=[],box,ap,x0=null,dr=null;const api={};
 const img=p=>p<pages.length?`<img src="${pages[p]}" draggable="false" alt="Página ${p+1}">`:'';
 const mk=p=>{const d=document.createElement('div');d.className='pg';d.innerHTML=img(p);return d};
 const PW=()=>parseFloat(root.style.getPropertyValue('--pw'))||300;
 /* el libro de doble página se usa siempre, también en el celular */
 function size(){const W=root.clientWidth,H=root.clientHeight,pd=Math.min(40,W*.03),dbl=S.style==='book';
  const pw=Math.max(40,dbl?Math.min((W-pd*2)/2,(H-pd*2)*ratio):Math.min(W-pd*2,(H-pd*2)*ratio));
  root.style.setProperty('--pw',pw+'px');root.style.setProperty('--ph',pw/ratio+'px');return dbl}
 function state(){
  if(mode==='d'){cur=c?2*c-1:0;bkw.classList.toggle('o0',c==0);bkw.classList.toggle('oE',c==L&&maxC==L);
   const l=cur+1,r=c&&2*c<pages.length?`–${l+1}`:'';cb(`${l}${r} de ${pages.length}`,c?[cur,2*c]:[0])}
  else cb(`${cur+1} de ${pages.length}`,[cur])}
 api.vars=()=>{const s=root.style;s.setProperty('--t',S.speed+'ms');s.setProperty('--sh',S.shadow);s.setProperty('--rad',S.radius+'px');s.setProperty('--warm',S.warm);
  s.background=`radial-gradient(ellipse at 50% 35%,${S.bg1},${S.bg2})`;clearInterval(ap);
  if(auto&&S.auto>0)ap=setInterval(()=>{const end=mode==='d'?c>=maxC:cur>=pages.length-1;end?api.go(0):api.next()},S.auto*1000)};
 api.build=()=>{root.innerHTML='';busy=false;const dbl=size();mode=dbl?'d':'s';
  if(dbl){L=Math.ceil(pages.length/2);maxC=pages.length%2?L-1:L;c=Math.min(maxC,Math.ceil(cur/2));
   root.innerHTML='<div class="bkw"><div class="sd"></div><div class="bk"></div></div>';bkw=root.firstChild;const bk=bkw.lastChild;leaves=[];
   for(let i=0;i<L;i++){const lf=document.createElement('div');lf.className='leaf'+(i<c?' flipped':'');lf.style.zIndex=i<c?i:L-i;
    lf.innerHTML=`<div class="face f">${img(2*i)}</div><div class="face b">${img(2*i+1)}</div>`;bk.appendChild(lf);leaves.push(lf)}
  }else{c=0;box=document.createElement('div');box.className='sg';root.appendChild(box);cur=Math.min(cur,pages.length-1);box.appendChild(mk(cur))}
  state();api.vars()};
 const settle=lf=>{const i=leaves.indexOf(lf);lf.style.zIndex=lf.classList.contains('flipped')?i:L-i;lf.classList.remove('turn')};
 function flip(dir){if(dir>0?c>=maxC:c<=0)return;const i=dir>0?c:c-1,lf=leaves[i];
  lf.style.zIndex=L+5;lf.classList.remove('turn');void lf.offsetWidth;lf.classList.add('turn');lf.classList.toggle('flipped',dir>0);c+=dir;
  setTimeout(()=>settle(lf),S.speed);state();snd()}
 function single(p){if(p===cur||busy)return;busy=true;const T=S.speed,dir=p>cur?1:-1,a=box.firstChild,b=mk(p),w=box.clientWidth;box.appendChild(b);
  const A=ANI[S.style](dir,w),o={duration:T,easing:'cubic-bezier(.6,.05,.2,1)',fill:'both'},h=A[2];
  a.animate(A[0],h?{...o,duration:T/2}:o);b.animate(A[1],h?{...o,duration:T/2,delay:T/2}:o);cur=p;state();snd();
  setTimeout(()=>{a.remove();b.getAnimations().forEach(x=>x.cancel());busy=false},T+40)}
 api.go=p=>{p=Math.max(0,Math.min(pages.length-1,p));
  if(mode==='d'){const t=Math.min(maxC,Math.ceil(p/2));if(t==c)return;const dir=t>c?1:-1;for(let k=0;k<Math.abs(t-c);k++)setTimeout(()=>flip(dir),k*Math.min(140,S.speed/4))}else single(p)};
 api.next=()=>api.go(mode==='d'?(c?2*c+1:1):cur+1);
 api.prev=()=>api.go(mode==='d'?Math.max(0,2*c-3):cur-1);
 /* arrastrar la hoja con el dedo, poco a poco */
 root.onpointerdown=e=>{x0=e.clientX;dr=null;try{root.setPointerCapture(e.pointerId)}catch(_){}};
 root.onpointermove=e=>{if(x0==null||mode!=='d')return;const dx=e.clientX-x0;
  if(dr===null&&Math.abs(dx)>8){const dir=dx<0?1:-1;dr=(dir>0?c>=maxC:c<=0)?false:{dir,lf:leaves[dir>0?c:c-1],p:0};
   if(dr){dr.lf.style.transition='none';dr.lf.style.zIndex=L+5}}
  if(dr){const p=Math.min(1,Math.max(0,(dr.dir>0?-dx:dx)/(PW()*1.15)));dr.p=p;dr.lf.style.transform=`rotateY(${dr.dir>0?-180*p:-180*(1-p)}deg)`}};
 root.onpointerup=root.onpointercancel=e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;
  if(dr){const {dir,lf,p}=dr;dr=null;lf.style.transition='';lf.style.transform='';
   if(p>.3){lf.classList.toggle('flipped',dir>0);c+=dir;state();snd()}
   setTimeout(()=>settle(lf),S.speed);return}
  if(Math.abs(dx)<10){let mid=root.getBoundingClientRect();mid=mid.left+mid.width/2;if(mode==='d'){const r=bkw.getBoundingClientRect();mid=r.left+r.width/2}
   e.clientX<mid?api.prev():api.next()}
  else if(mode==='s'&&Math.abs(dx)>50)dx<0?api.next():api.prev()};
 const ro=new ResizeObserver(()=>{if(!root.clientWidth)return;const d=size();if((d?'d':'s')!==mode)api.build()});ro.observe(root);
 api.destroy=()=>{clearInterval(ap);ro.disconnect();root.onpointerdown=root.onpointermove=root.onpointerup=root.onpointercancel=null;root.innerHTML=''};
 api.build();return api}
function thumbs(el,bk){el.hidden=!S.thumbs;el.innerHTML=pages.map((p,i)=>`<img src="${p}" data-i="${i}" alt="Ir a la página ${i+1}">`).join('');el.onclick=e=>{const i=e.target.dataset.i;if(i!=null)bk.go(+i)}}
function mark(el,v){[...el.children].forEach((im,i)=>im.classList.toggle('on',v.includes(i)));const o=el.children[v[0]];o&&o.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}

/* ===== PDF ===== */
const ld=u=>new Promise((o,k)=>{const s=document.createElement('script');s.src=u;s.onload=o;s.onerror=()=>k(new Error('No se pudo cargar el lector de PDF. Revisa tu conexión.'));document.head.appendChild(s)});
const loadLib=()=>window.pdfjsLib?Promise.resolve():ld(CDN+'pdf.min.js').then(()=>ld(CDN+'pdf.worker.min.js')).then(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.worker.min.js'});
async function openPdf(data){await loadLib();pdfDoc=await pdfjsLib.getDocument({data}).promise;await renderAll()}
async function renderAll(){const n=pdfDoc.numPages,out=[];
 for(let i=1;i<=n;i++){load(true,`Procesando página ${i} de ${n}`,(i-1)/n);await new Promise(r=>setTimeout(r,0));
  const p=await pdfDoc.getPage(i),v1=p.getViewport({scale:1}),v=p.getViewport({scale:900*S.q/v1.width}),c=document.createElement('canvas');
  c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;if(i==1)ratio=v.width/v.height;
  out.push(c.toDataURL('image/jpeg',.85));c.width=c.height=0}
 pages=out;load(false)}
function demo(){pdfDoc=null;ratio=.75;pages=[];S={...D,title:'Revista de ejemplo'};
 const T=['Portada','Editorial','Viajes','Ciencia','Cocina','Arte','Fotografía','Contraportada'];
 T.forEach((t,i)=>{const c=document.createElement('canvas');c.width=720;c.height=960;const x=c.getContext('2d'),h=(i*47+250)%360,dk=i&&i<7,g=x.createLinearGradient(0,0,720,960);
  g.addColorStop(0,`hsl(${h},75%,${dk?93:40}%)`);g.addColorStop(1,`hsl(${h+40},65%,${dk?78:16}%)`);x.fillStyle=g;x.fillRect(0,0,720,960);
  x.fillStyle=`hsla(${h},80%,60%,.35)`;x.beginPath();x.arc(i%2?560:160,700,210,0,7);x.fill();
  x.fillStyle=dk?'#1d1b3a':'#fff';x.textAlign='left';x.font='800 88px Georgia,serif';x.fillText(t,56,dk?200:450);
  x.font='23px Georgia,serif';for(let k=0;k<(dk?9:2);k++)x.fillText(dk?'Texto de ejemplo para ver cómo se pasa la hoja.':'Número 01',56,dk?270+k*36:505+k*36);
  x.font='bold 24px Georgia,serif';x.textAlign=i%2?'left':'right';x.fillText(i+1,i%2?56:664,912);pages.push(c.toDataURL('image/jpeg',.85))});
 openEditor()}

/* ===== editor ===== */
const ctl=([k,t,l,o])=>{const v=S[k];let i;
 if(t==='chk')return`<label class="ck"><input type="checkbox" data-k="${k}"${v?' checked':''}>${l}</label>`;
 if(t==='text')i=`<input type="text" data-k="${k}" value="${esc(v)}">`;
 if(t==='col')i=`<input type="color" data-k="${k}" value="${v}">`;
 if(t==='sel')i=`<select data-k="${k}">${Object.entries(o).map(([a,b])=>`<option value="${a}"${a==v?' selected':''}>${b}</option>`).join('')}</select>`;
 if(t==='rng')i=`<div class="rg"><input type="range" data-k="${k}" data-u="${o[3]}" min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${v}"><output>${v}${o[3]}</output></div>`;
 return`<label class="fl"><span>${l}</span>${i}</label>`};
function buildPanel(){const el=$('#panel'),op=el.querySelectorAll('details'),was=[...op].map(d=>d.open);
 el.innerHTML='<h2>Personaliza tu revista</h2><details class="g"><summary>Temas rápidos</summary><div class="pre">'+TH.map((t,i)=>`<button data-t="${i}" style="background:linear-gradient(135deg,${t[1]},${t[2]})">${t[0]}</button>`).join('')+'</div></details>'+
  P.map(([g,f])=>`<details class="g"><summary>${g}</summary>${f.map(ctl).join('')}</details>`).join('');
 el.querySelectorAll('details').forEach((d,i)=>d.open=was.length?was[i]:(!MOB||i<3));
 el.onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.bg1=TH[b.dataset.t][1];S.bg2=TH[b.dataset.t][2];buildPanel();bE.vars()}};
 el.oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;let v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;if(k==='q')v=+v;S[k]=v;
  if(t.type==='range')t.nextElementSibling.textContent=v+t.dataset.u;
  if(k==='style')bE.build();else if(k==='q')requal();else bE.vars();
  if(k==='thumbs')$('#th').hidden=!v}}
let qt;function requal(){if(!pdfDoc)return toast('La resolución se aplica al cargar un PDF.');clearTimeout(qt);qt=setTimeout(async()=>{await renderAll();thumbs($('#th'),bE);bE.build()},500)}
function openEditor(){show('ed');buildPanel();bE&&bE.destroy();document.title=S.title;
 bE=Book($('#stage'),(l,v)=>{$('#lab').textContent=l;mark($('#th'),v)});thumbs($('#th'),bE);act=bE;
 $('#tb').innerHTML='<button class="b" id="x1">Cancelar</button><button class="b p" id="x2">Ver<span class="lg"> revista</span> terminada</button>';
 $('#x1').onclick=()=>{bE.destroy();bE=null;act=null;pdfDoc=null;show('up');$('#tb').innerHTML=''};
 $('#x2').onclick=()=>openReader(false)}
function openReader(only){show('rd');$('#tb').innerHTML='';$('#rt').textContent=S.title;document.title=S.title;
 $('#bk').hidden=$('#dl').hidden=only;$('#fs').hidden=!$('#rd').requestFullscreen;
 bE&&bE.destroy();bE=null;bR&&bR.destroy();bR=Book($('#rs'),(l,v)=>{$('#rl').textContent=l;mark($('#rth'),v)},true);thumbs($('#rth'),bR);act=bR;
 if(S.style==='book'&&innerWidth<600&&innerHeight>innerWidth)toast('Gira el celular para ver las páginas más grandes.')}

/* ===== descarga de la revista terminada ===== */
const slug=()=>(S.title||'revista').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'revista';
function exportHtml(){load(true,'Preparando tu revista…',.5);
 setTimeout(()=>{try{const j=JSON.stringify({s:S,pages,ratio}).replace(/</g,'\\u003c'),h=SRC.replace('window.__EMBED=null/*E*/',()=>'window.__EMBED='+j+'/*E*/'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=slug()+'.html';document.body.appendChild(a);a.click();a.remove();
  toast('Revista descargada. Ábrela con el navegador o súbela a tu sitio.')}catch(e){toast('No se pudo preparar el archivo: '+e.message)}load(false)},60)}

/* ===== eventos ===== */
const f=$('#file'),dp=$('#drop');
async function onFile(file){if(!file||!/pdf$/i.test(file.type||file.name))return toast('Selecciona un archivo PDF.');
 try{load(true,'Leyendo PDF…');S={...D,title:file.name.replace(/\.pdf$/i,'')};await openPdf(new Uint8Array(await file.arrayBuffer()));openEditor()}catch(e){load(false);toast('No se pudo leer el PDF: '+e.message)}}
f.onchange=()=>{onFile(f.files[0]);f.value=''};
dp.ondragover=e=>{e.preventDefault();dp.classList.add('ov')};dp.ondragleave=()=>dp.classList.remove('ov');
dp.ondrop=e=>{e.preventDefault();dp.classList.remove('ov');onFile(e.dataTransfer.files[0])};
$('#demo').onclick=demo;
$('#ep').onclick=()=>bE.prev();$('#en').onclick=()=>bE.next();$('#rp').onclick=()=>bR.prev();$('#rn').onclick=()=>bR.next();
$('#bk').onclick=()=>{bR.destroy();bR=null;openEditor()};
$('#dl').onclick=exportHtml;
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#rd').requestFullscreen();
onkeydown=e=>{if(!act||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(e.key==='ArrowRight')act.next();else if(e.key==='ArrowLeft')act.prev();else if(e.key==='Home')act.go(0);else if(e.key==='End')act.go(pages.length-1)};

/* arranque: editor, o revista descargada */
if(E){S={...D,...E.s};pages=E.pages;ratio=E.ratio;openReader(true)}
})();
</script>
</body>
